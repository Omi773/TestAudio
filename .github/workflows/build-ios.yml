name: Build iOS (unsigned IPA)

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26.1.1
        run: |
          sudo xcode-select -s /Applications/Xcode_26.1.1.app
          xcodebuild -version

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Archive (unsigned)
        run: |
          xcodebuild -project AudioTest.xcodeproj \
            -scheme AudioTest \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath build/App.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" DEVELOPMENT_TEAM=""

      - name: Create IPA
        run: |
          mkdir -p build/ipa
          cd build/App.xcarchive/Products/Applications
          mkdir Payload
          cp -r AudioTest.app Payload/
          zip -r "$GITHUB_WORKSPACE/build/ipa/AudioTest-ios-unsigned.ipa" Payload

      - uses: actions/upload-artifact@v4
        with:
          name: AudioTest-ios
          path: build/ipa/*.ipa